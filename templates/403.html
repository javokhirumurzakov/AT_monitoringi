<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>403 - Ruxsat yo'q</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,.15);
            text-align: center;
            max-width: 500px;
        }

        h1 {
            color: #dc3545;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            margin-bottom: 25px;
        }

        a {
            display: inline-block;
            padding: 10px 20px;
            background: #0d6efd;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #0b5ed7;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>403 - Ruxsat yo'q</h1>
        <p>Ushbu sahifaga kirish huquqiga ega emassiz.</p>
        <a href="/">Bosh sahifaga qaytish</a>
    </div>
    </div>
</body>
</html>
